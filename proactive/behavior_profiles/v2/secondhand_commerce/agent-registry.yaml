    runtime_profile: clawops-browser
    role: external_browser_execution
    allowed_tools:
      - memory_read
      - docs_read
      - kanban
      - status_check
      - browser_cdp
      - browser_snapshot
      - browser_navigate
      - browser_click
      - browser_type
      - browser_scroll
      - browser_press
      - browser_dialog
      - browser_upload_files
      - report_generate
    risk_level_limit: medium
    # Hermes may elevate only one validated, approved Loop Contract at a time.
    # This does not change the worker's global medium ceiling.
    contract_risk_level_limit: high
    approval_required: true
    approval_required_actions:
      - new_destination
      - changed_copy
      - changed_assets
      - join_group
      - private_message
      - comment
      - payment
      - promotion
      - account_setting
      - credential_access
    approval_checklist: External Browser Publish
    output_schema:
      format: markdown
      required_sections: [summary, destinations, evidence, warnings, next_actions]
    timeout_seconds: 1800
    retry_policy:
      max_attempts: 1
      backoff_seconds: 0

  clawops.browser_readonly:
