      - status_check
      - facebook_page_graph_status
      - facebook_page_graph_publish
      - report_generate
    required_callable_tools:
      - facebook_page_graph_status
      - facebook_page_graph_publish
    risk_level_limit: medium
    contract_risk_level_limit: high
    approval_required: true
    approval_required_actions:
      - publish
      - changed_copy
      - changed_assets
      - new_destination
      - credential_access
    approval_checklist: Facebook Page Graph API Publish
    output_schema:
      format: json
      required_sections: [summary, post_id, permalink_url, evidence, warnings]
    timeout_seconds: 900
    retry_policy:
      max_attempts: 1
      backoff_seconds: 0

  clawops.facebook_page_preflight:
    display_name: ClawOps Facebook Page Preflight Worker
    runtime_profile: missioncrew-facebook-page-operator
    role: facebook_page_publish_preflight
    allowed_tools:
      - facebook_page_publish_preflight
    required_callable_tools:
