    approval_required: false
    approval_required_actions: [external_send, publish, deployment, credential_access]
    approval_checklist: DevOps and Integration
    output_schema:
      format: markdown
      required_sections: [summary, routing, status, blockers, next_actions]
    timeout_seconds: 900
