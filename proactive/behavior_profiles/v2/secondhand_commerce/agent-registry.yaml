    runtime_profile: clawops-review
    role: review
    allowed_tools: [memory_read, docs_read, tests, report_generate]
    risk_level_limit: high
    approval_required: true
    approval_required_actions: [approval_gate, publish, deployment, financial_claim]
    approval_checklist: Finance, Crypto, Trading, and ingrids.app
    output_schema:
      format: markdown
      required_sections: [summary, findings, risk_decision, approval_status, next_actions]
    timeout_seconds: 1500
    retry_policy:
      max_attempts: 1
      backoff_seconds: 0
